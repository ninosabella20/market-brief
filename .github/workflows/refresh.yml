name: Refresh market brief

on:
  schedule:
    # Data should be READY by 07:00 Madrid, so the build starts ~06:10.
    # Madrid is UTC+1 (winter) / UTC+2 (summer): these times cover both seasons,
    # :40 is a backup if GitHub drops a run, and build.py skips runs that aren't due.
    # NOTE: never change this file in a commit marked [skip ci] - GitHub may then
    # not register the new schedule.
    - cron: "10,40 4,5 * * *"
  # Code/workflow changes trigger an immediate run (data-only commits don't).
  push:
    branches: [main]
    paths: ["scripts/**", "requirements.txt", ".github/workflows/**"]
  # Also started every day at 06:05 Madrid by cron-job.org through the API
  # (inputs.force=false, so it respects the window); see README "Reliable 06:05 trigger".
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 06:00-08:00 Madrid window"
        type: boolean
        default: true
      sectors:
        description: "Only these sectors' stories, e.g. XLK,XLE (empty = all 11)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Unpinned on purpose: Yahoo changes often and yfinance fixes ship quickly.
      - run: pip install --upgrade -r requirements.txt

      - name: Build docs/data.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MIN_INTERVAL: ${{ vars.GEMINI_MIN_INTERVAL || '12' }}
          # Code pushes are smoke tests: 1 sector (2 Gemini calls) to save free quota,
          # unless the commit message contains [full].
          STORY_SECTORS: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[full]') && 'XLK' || inputs.sectors || '' }}
          FORCE_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
        run: python scripts/build.py

      # Runs AFTER the market data is built; can never block or break it.
      # Weekly profiles + daily "this week" lines -> docs/geo.json
      - name: Build docs/geo.json (geopolitics)
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MIN_INTERVAL: ${{ vars.GEMINI_MIN_INTERVAL || '12' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # only after a real market build (skip-runs outside the 06:00-08:00 window don't touch geo)
          if git diff --quiet -- docs/data.json; then echo "market build skipped; geo skipped too"; exit 0; fi
          python scripts/geo.py

      - name: Commit data
        run: |
          if git diff --quiet -- docs/data.json docs/geo.json && [ -z "$(git status --porcelain docs/geo.json)" ]; then
            echo "No changes to commit"; exit 0
          fi
          git config user.name  "market-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if [ -f docs/geo.json ]; then git add docs/geo.json; fi
          git commit -m "Refresh data $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
